services:
  api:
    build: .
    container_name: kleion-api
    ports:
      - "3333:3333"
    environment:
      DATABASE_URL: postgresql://kleion:kleion@postgres:5432/kleion
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      - postgres

  postgres:
    image: postgres:17
    container_name: kleion-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: kleion
      POSTGRES_PASSWORD: kleion
      POSTGRES_DB: kleion
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
